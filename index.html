<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela FIPE</title>

</head>
<body>

    <div class="container">
        <h1>Consulta por Código carro FIPE</h1>

        <form id="fipeForm">
            <label for="fipeCode">Código FIPE</label>
            <input type="text" id="fipeCode" placeholder="Exemplo: 009206-1" required />

            <button type="submit">Consultar veículo</button>
        </form>

        <div class="result" id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
